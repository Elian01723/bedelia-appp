<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- App instalable (PWA) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bedelía U">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <title>Bedelía U - Dashboard y Control de Equipos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <div id="app" class="h-full flex flex-col">
        <!-- Contenido renderizado dinámicamente -->
    </div>

    <script>
        const STORAGE_KEY = 'bedelia_app_advanced_db_v3';
        
        let state = loadState();
        let termsAccepted = false; // Debe aceptar términos para poder iniciar sesión

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { return JSON.parse(saved); } catch(e) { console.error(e); }
            }
            return {
                currentUser: null,
                activeTab: 'dashboard',
                profesores: [
                    { cc: '1098765432', nombre: 'Dr. Carlos Mendoza' },
                    { cc: '1023456789', nombre: 'Dra. Ana María Gómez' },
                    { cc: '1045678912', nombre: 'Ing. Luis Fernando Ruiz' }
                ],
                equipos: [
                    { codigo: 'VB-01', tipo: 'Video-beam', modelo: 'Epson PowerLite X49', estado: 'Disponible' },
                    { codigo: 'VB-02', tipo: 'Video-beam', modelo: 'Sony VPL-EX435', estado: 'Prestado' },
                    { codigo: 'PC-01', tipo: 'Laptop', modelo: 'Dell Latitude 3420', estado: 'Disponible' },
                    { codigo: 'PC-02', tipo: 'Laptop', modelo: 'Lenovo ThinkPad E14', estado: 'Prestado' }
                ],
                prestamos: [
                    { id: 101, cc: '1098765432', nombre: 'Dr. Carlos Mendoza', equipo: 'VB-02 - Video-beam (Sony VPL-EX435)', codigoEquipo: 'VB-02', horaSalida: '08:30 AM', estado: 'Activo' },
                    { id: 102, cc: '1023456789', nombre: 'Dra. Ana María Gómez', equipo: 'PC-02 - Laptop (Lenovo ThinkPad E14)', codigoEquipo: 'PC-02', horaSalida: '09:15 AM', estado: 'Activo' }
                ],
                historialLogs: [
                    { id: 1, fecha: 'Hoy, 09:15 AM', tipo: 'PRÉSTAMO', descripcion: 'Dra. Ana María Gómez retiró Laptop (PC-02)', color: 'blue' },
                    { id: 2, fecha: 'Hoy, 08:30 AM', tipo: 'PRÉSTAMO', descripcion: 'Dr. Carlos Mendoza retiró Video-beam (VB-02)', color: 'blue' },
                    { id: 3, fecha: 'Ayer, 02:00 PM', tipo: 'EQUIPO', descripcion: 'Se registró nuevo Video-beam (VB-02)', color: 'indigo' },
                    { id: 4, fecha: 'Ayer, 10:00 AM', tipo: 'PROFESOR', descripcion: 'Se registró nuevo profesor Dr. Carlos Mendoza', color: 'emerald' }
                ],
                toast: null
            };
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function registrarLog(tipo, descripcion, color) {
            const now = new Date();
            const fecha = `Hoy, ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            state.historialLogs.unshift({ id: Date.now(), fecha, tipo, descripcion, color });
        }

        function showToast(message, type = 'success') {
            state.toast = { message, type };
            render();
            setTimeout(() => {
                if (state.toast && state.toast.message === message) {
                    state.toast = null;
                    render();
                }
            }, 3000);
        }

        function render() {
            const app = document.getElementById('app');

            if (!state.currentUser) {
                app.innerHTML = renderLoginScreen();
                return;
            }

            app.innerHTML = `
                <div class="h-full flex flex-col md:flex-row bg-slate-950 overflow-hidden">
                    ${renderSidebar()}
                    <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-900 border-l border-slate-800">
                        ${renderHeader()}
                        <main class="flex-1 overflow-y-auto p-4 md:p-8 relative">
                            ${state.toast ? renderToast() : ''}
                            <div class="max-w-7xl mx-auto fade-in">
                                ${
                                    state.activeTab === 'dashboard' ? renderDashboardView() :
                                    state.activeTab === 'prestamos' ? renderPrestamosView() :
                                    state.activeTab === 'equipos' ? renderEquiposView() :
                                    state.activeTab === 'profesores' ? renderProfesoresView() :
                                    state.activeTab === 'historial' ? renderHistorialView() : ''
                                }
                            </div>
                        </main>
                    </div>
                </div>
            `;
        }

        function renderLoginScreen() {
            return `
                <div class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-950">
                    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-8 space-y-6 fade-in">
                        <div class="text-center space-y-2">
                            <div class="inline-flex p-3.5 bg-blue-600/20 border border-blue-500/30 text-blue-400 rounded-2xl mb-1">
                                <i class="fa-solid fa-graduation-cap text-2xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight text-white">Bedelía Universitaria</h1>
                            <p class="text-xs text-slate-400">Panel administrativo con dashboard y control en tiempo real</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Usuario / Correo</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                                        <i class="fa-solid fa-envelope text-xs"></i>
                                    </span>
                                    <input type="text" id="loginUser" required autocomplete="off" placeholder="Ingrese su correo" oninput="hideLoginError()"
                                        class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-blue-500 transition-all">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Contraseña</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                                        <i class="fa-solid fa-lock text-xs"></i>
                                    </span>
                                    <input type="password" id="loginPass" required autocomplete="new-password" placeholder="Ingrese su contraseña" oninput="hideLoginError()"
                                        class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-blue-500 transition-all">
                                </div>
                            </div>

                            <p id="loginError" class="hidden text-xs text-rose-400 flex items-center space-x-1.5">
                                <i class="fa-solid fa-circle-exclamation"></i>
                                <span>Usuario o contraseña incorrectos.</span>
                            </p>

                            <!-- TÉRMINOS Y CONDICIONES -->
                            <div>
                                <label class="flex items-start space-x-3 cursor-pointer select-none">
                                    <input type="checkbox" id="acceptTerms" ${termsAccepted ? 'checked' : ''} onchange="onTermsChange(this.checked)"
                                        class="mt-0.5 h-4 w-4 rounded border-slate-700 bg-slate-950 accent-blue-600 cursor-pointer">
                                    <span class="text-xs text-slate-400 leading-relaxed">
                                        He leído y acepto los
                                        <a href="#" onclick="openTerms(event)" class="text-blue-400 hover:text-blue-300 underline font-medium">Términos y Condiciones</a>
                                        de uso del sistema.
                                    </span>
                                </label>
                                <p id="termsError" class="hidden mt-2 text-xs text-rose-400 flex items-center space-x-1.5">
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    <span>Debes aceptar los Términos y Condiciones para iniciar sesión.</span>
                                </p>
                            </div>

                            <button type="submit" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center space-x-2">
                                <span>Iniciar Sesión en el Sistema</span>
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>

                            <!-- ACCESO INVITADO (solo lectura) -->
                            <div class="flex items-center space-x-3">
                                <div class="flex-1 h-px bg-slate-800"></div>
                                <span class="text-[10px] uppercase tracking-wider text-slate-500">o</span>
                                <div class="flex-1 h-px bg-slate-800"></div>
                            </div>
                            <button type="button" onclick="handleGuestLogin()" class="w-full py-3 px-4 bg-slate-950 hover:bg-slate-800 border border-slate-700 text-slate-200 text-sm font-semibold rounded-xl transition-all flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-eye text-xs"></i>
                                <span>Entrar como Invitado (solo lectura)</span>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            if (!termsAccepted) {
                const err = document.getElementById('termsError');
                if (err) err.classList.remove('hidden');
                return;
            }
            const userIngresado = (document.getElementById('loginUser').value || '').trim().toLowerCase();
            const passIngresada = document.getElementById('loginPass').value || '';
            if (userIngresado !== 'bedelia.admin@universidad.edu' || passIngresada !== '123456') {
                const errCred = document.getElementById('loginError');
                if (errCred) errCred.classList.remove('hidden');
                return;
            }
            state.currentUser = { name: 'Operador Bedelía', role: 'Administrador General' };
            saveState();
            showToast('¡Sesión iniciada correctamente!');
            render();
        }

        function handleLogout() {
            state.currentUser = null;
            saveState();
            showToast('Sesión finalizada', 'info');
            render();
        }

        function renderSidebar() {
            const tabs = [
                { id: 'dashboard', label: 'Dashboard General', icon: 'fa-chart-pie' },
                { id: 'prestamos', label: 'Préstamos & Salidas', icon: 'fa-clipboard-list' },
                { id: 'equipos', label: 'Gestión de Equipos', icon: 'fa-desktop' },
                { id: 'profesores', label: 'Directorio Profesores', icon: 'fa-chalkboard-user' },
                { id: 'historial', label: 'Historial y Logs', icon: 'fa-clock-rotate-left' }
            ];

            return `
                <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between shrink-0">
                    <div>
                        <div class="p-6 flex items-center space-x-3 border-b border-slate-800/80">
                            <div class="p-2.5 bg-blue-600 text-white rounded-xl shadow-md shadow-blue-600/30">
                                <i class="fa-solid fa-laptop-code"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-sm tracking-wide text-white">BEDELÍA U</h2>
                                <p class="text-[11px] text-slate-400">Control Inteligente</p>
                            </div>
                        </div>

                        <nav class="p-4 space-y-1.5">
                            ${tabs.map(t => `
                                <button onclick="switchTab('${t.id}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold transition-all ${state.activeTab === t.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'}">
                                    <i class="fa-solid ${t.icon} w-4 text-center"></i>
                                    <span>${t.label}</span>
                                </button>
                            `).join('')}
                        </nav>
                    </div>

                    <div class="p-4 border-t border-slate-800/80 m-4 bg-slate-900/60 rounded-2xl flex items-center justify-between">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-9 h-9 rounded-full bg-blue-500/20 border border-blue-500/30 text-blue-300 font-semibold flex items-center justify-center shrink-0">
                                ${state.currentUser.name.charAt(0)}
                            </div>
                            <div class="truncate">
                                <p class="text-xs font-semibold text-slate-200 truncate">${state.currentUser.name}</p>
                                <p class="text-[10px] text-slate-400 truncate">${state.currentUser.role}</p>
                            </div>
                        </div>
                        <button onclick="handleLogout()" title="Cerrar Sesión" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-colors">
                            <i class="fa-solid fa-power-off text-xs"></i>
                        </button>
                    </div>
                </aside>
            `;
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            render();
        }

        function renderHeader() {
            const titles = {
                dashboard: { title: 'Dashboard y Analítica', sub: 'Resumen general del estado de equipos y actividad reciente' },
                prestamos: { title: 'Control de Salidas y Préstamos', sub: 'Gestione préstamos en tiempo real con búsqueda por CC o nombre' },
                equipos: { title: 'Inventario de Equipos', sub: 'Administre computadores portátiles y video-beams disponibles' },
                profesores: { title: 'Directorio de Profesores', sub: 'Base de datos de docentes habilitados en la institución' },
                historial: { title: 'Registro y Auditoría de Actividad', sub: 'Historial completo de cada movimiento realizado en el sistema' }
            };
            const current = titles[state.activeTab] || {};

            return `
                <header class="bg-slate-950/60 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
                    <div>
                        <h1 class="text-base font-bold text-white">${current.title}</h1>
                        <p class="text-xs text-slate-400">${current.sub}</p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-300 font-medium flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>Sistema Activo</span>
                        </div>
                    </div>
                </header>
            `;
        }

        function renderToast() {
            if (!state.toast) return '';
            const bg = state.toast.type === 'error' ? 'bg-rose-500/10 border-rose-500/30 text-rose-300' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300';
            const icon = state.toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            return `
                <div class="fixed bottom-6 right-6 z-50 flex items-center space-x-3 px-4 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl ${bg} fade-in">
                    <i class="fa-solid ${icon}"></i>
                    <span class="text-xs font-medium">${state.toast.message}</span>
                </div>
            `;
        }

        function renderDashboardView() {
            const totalPrestamosActivos = state.prestamos.filter(p => p.estado === 'Activo').length;
            const totalEquipos = state.equipos.length;
            const equiposDisponibles = state.equipos.filter(e => e.estado === 'Disponible').length;
            const equiposPrestados = state.equipos.filter(e => e.estado === 'Prestado').length;
            const totalProfes = state.profesores.length;

            const videoBeams = state.equipos.filter(e => e.tipo.includes('Video-beam'));
            const laptops = state.equipos.filter(e => e.tipo.includes('Laptop') || e.tipo.includes('Computador'));
            const vbDisponibles = videoBeams.filter(e => e.estado === 'Disponible').length;
            const pcDisponibles = laptops.filter(e => e.estado === 'Disponible').length;

            return `
                <div class="space-y-6">
                    <!-- Tarjetas de Estadísticas Principales -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Préstamos Activos</span>
                                <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-xl"><i class="fa-solid fa-clock-rotate-left"></i></div>
                            </div>
                            <div class="mt-4 flex items-baseline justify-between">
                                <span class="text-3xl font-bold text-white">${totalPrestamosActivos}</span>
                                <span class="text-xs text-blue-400 font-medium">Equipos fuera</span>
                            </div>
                        </div>

                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Inventario Total</span>
                                <div class="p-2.5 bg-indigo-500/10 text-indigo-400 rounded-xl"><i class="fa-solid fa-boxes-stacked"></i></div>
                            </div>
                            <div class="mt-4 flex items-baseline justify-between">
                                <span class="text-3xl font-bold text-white">${totalEquipos}</span>
                                <span class="text-xs text-indigo-400 font-medium">Dispositivos reg.</span>
                            </div>
                        </div>

                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Disponibles</span>
                                <div class="p-2.5 bg-emerald-500/10 text-emerald-400 rounded-xl"><i class="fa-solid fa-circle-check"></i></div>
                            </div>
                            <div class="mt-4 flex items-baseline justify-between">
                                <span class="text-3xl font-bold text-white">${equiposDisponibles}</span>
                                <span class="text-xs text-emerald-400 font-medium">Listos para entrega</span>
                            </div>
                        </div>

                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Docentes en BD</span>
                                <div class="p-2.5 bg-purple-500/10 text-purple-400 rounded-xl"><i class="fa-solid fa-users"></i></div>
                            </div>
                            <div class="mt-4 flex items-baseline justify-between">
                                <span class="text-3xl font-bold text-white">${totalProfes}</span>
                                <span class="text-xs text-purple-400 font-medium">Habilitados</span>
                            </div>
                        </div>
                    </div>

                    <!-- Gráficos y Desglose Visual -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Desglose por Tipo de Equipo -->
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                            <h3 class="font-bold text-white text-sm flex items-center justify-between">
                                <span>Desglose por Tipo de Activo</span>
                                <i class="fa-solid fa-chart-bar text-slate-500 text-xs"></i>
                            </h3>
                            <div class="space-y-4 pt-2">
                                <div>
                                    <div class="flex justify-between text-xs mb-1">
                                        <span class="text-slate-300 font-medium">Laptops / Computadores (${laptops.length} total)</span>
                                        <span class="text-emerald-400">${pcDisponibles} disponibles</span>
                                    </div>
                                    <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-800">
                                        <div class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: ${laptops.length ? (pcDisponibles / laptops.length) * 100 : 0}%"></div>
                                    </div>
                                </div>

                                <div>
                                    <div class="flex justify-between text-xs mb-1">
                                        <span class="text-slate-300 font-medium">Video-beams (${videoBeams.length} total)</span>
                                        <span class="text-emerald-400">${vbDisponibles} disponibles</span>
                                    </div>
                                    <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-800">
                                        <div class="bg-indigo-600 h-full rounded-full transition-all duration-500" style="width: ${videoBeams.length ? (vbDisponibles / videoBeams.length) * 100 : 0}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Estado General del Inventario -->
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                            <h3 class="font-bold text-white text-sm flex items-center justify-between">
                                <span>Estado Operativo del Inventario</span>
                                <i class="fa-solid fa-circle-nodes text-slate-500 text-xs"></i>
                            </h3>
                            <div class="grid grid-cols-2 gap-4 pt-2">
                                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl text-center space-y-1">
                                    <p class="text-2xl font-bold text-emerald-400">${equiposDisponibles}</p>
                                    <p class="text-xs text-slate-400 font-medium">Disponibles en Bodega</p>
                                </div>
                                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl text-center space-y-1">
                                    <p class="text-2xl font-bold text-amber-400">${equiposPrestados}</p>
                                    <p class="text-xs text-slate-400 font-medium">Prestados / En Clase</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Actividad Reciente en el Dashboard -->
                    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-white text-sm">Últimos Movimientos Registrados</h3>
                            <button onclick="switchTab('historial')" class="text-xs text-blue-400 hover:underline">Ver historial completo</button>
                        </div>
                        <div class="divide-y divide-slate-800 text-xs">
                            ${state.historialLogs.slice(0, 4).map(log => `
                                <div class="py-3 flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <span class="w-2 h-2 rounded-full bg-${log.color === 'blue' ? 'blue' : log.color === 'indigo' ? 'indigo' : 'emerald'}-500"></span>
                                        <span class="text-slate-200 font-medium">${log.descripcion}</span>
                                    </div>
                                    <span class="text-slate-500 text-[11px]">${log.fecha}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

        function registrarPrestamo(e) {
            e.preventDefault();
            const cc = document.getElementById('selectedProfCC').value;
            const codigoEquipo = document.getElementById('selectEquipoPrestamo').value;

            if (!cc) {
                showToast('Por favor seleccione un profesor válido de la lista', 'error');
                return;
            }

            const profesor = state.profesores.find(p => p.cc === cc);
            const equipo = state.equipos.find(eq => eq.codigo === codigoEquipo);

            if (!profesor || !equipo) {
                showToast('Datos inválidos para procesar el préstamo', 'error');
                return;
            }

            equipo.estado = 'Prestado';

            state.prestamos.unshift({
                id: Date.now(),
                cc: profesor.cc,
                nombre: profesor.nombre,
                equipo: `${equipo.codigo} - ${equipo.tipo} (${equipo.modelo})`,
                codigoEquipo: equipo.codigo,
                horaSalida: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                estado: 'Activo'
            });

            registrarLog('PRÉSTAMO', `${profesor.nombre} retiró ${equipo.tipo} (${equipo.codigo})`, 'blue');
            saveState();
            showToast('¡Préstamo registrado exitosamente!');
            render();
        }

            state.prestamos = state.prestamos.filter(p => p.id !== prestamoId);

            if (equipo) {

        // ================= DESCARGAR AUDITORÍA EN PDF =================
        // Genera el PDF directamente en el navegador (no requiere librerías externas ni internet).
        function descargarHistorialPDF() {
            const logs = state.historialLogs || [];
            if (!logs.length) {
                showToast('No hay registros en el historial para descargar', 'info');
                return;
            }

            const PW = 595.28, PH = 841.89, M = 40;          // A4 vertical, márgenes en puntos
            const COLS = [105, 85, PW - 2 * M - 190];        // Fecha | Tipo | Descripción
            const FS = 9, LH = 12, PADX = 6, PADY = 6, FOOT = 34;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext ? canvas.getContext('2d') : null;

            function tw(s, size, bold) {
                if (ctx) {
                    ctx.font = (bold ? 'bold ' : '') + size + 'px Arial, Helvetica, sans-serif';
                    return ctx.measureText(s).width;
                }
                return s.length * size * 0.5;
            }

            // Convierte texto a Latin-1 / WinAnsi (tildes y ñ) y escapa los caracteres especiales del PDF
            const WIN = { '\u2013': '\x96', '\u2014': '\x97', '\u2018': '\x91', '\u2019': '\x92', '\u201C': '\x93', '\u201D': '\x94', '\u2022': '\x95', '\u20AC': '\x80' };
            function enc(s) {
                s = String(s == null ? '' : s).normalize('NFC');
                let o = '';
                for (const ch of s) {
                    if (WIN[ch]) { o += WIN[ch]; continue; }
                    const c = ch.charCodeAt(0);
                    if (/\s/.test(ch)) o += ' ';
                    else if (c < 32 || (c >= 127 && c < 160)) continue;
                    else if (c < 256) o += ch;
                    else o += '?';
                }
                return o.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            }

            function wrap(s, maxW, size, bold) {
                const lines = [];
                String(s == null ? '' : s).split(/\n/).forEach(function(par) {
                    let line = '';
                    par.split(/\s+/).forEach(function(word) {
                        if (!word) return;
                        let test = line ? line + ' ' + word : word;
                        if (tw(test, size, bold) <= maxW) { line = test; return; }
                        if (line) { lines.push(line); line = ''; }
                        // palabra más larga que la columna: se corta por caracteres
                        while (tw(word, size, bold) > maxW && word.length > 1) {
                            let n = word.length - 1;
                            while (n > 1 && tw(word.slice(0, n), size, bold) > maxW) n--;
                            lines.push(word.slice(0, n));
                            word = word.slice(n);
                        }
                        line = word;
                    });
                    lines.push(line);
                });
                return lines;
            }

            const pages = [];
            let cur = '', y = 0;
            const f2 = function(n) { return n.toFixed(2); };
            function text(x, yy, s, size, bold, rgb) {
                cur += rgb + ' rg BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + f2(x) + ' ' + f2(yy) + ' Td (' + enc(s) + ') Tj ET\n';
            }
            function rect(x, yy, w, h, rgb) { cur += rgb + ' rg ' + f2(x) + ' ' + f2(yy) + ' ' + f2(w) + ' ' + f2(h) + ' re f\n'; }
            function hline(yy, rgb) { cur += '0.5 w ' + rgb + ' RG ' + f2(M) + ' ' + f2(yy) + ' m ' + f2(PW - M) + ' ' + f2(yy) + ' l S\n'; }

            const DARK = '0.12 0.16 0.23', TXT = '0.13 0.16 0.22', GRAY = '0.42 0.45 0.5';
            const TIPO_COLOR = { 'PRÉSTAMO': '0.15 0.39 0.92', 'DEVOLUCIÓN': '0.02 0.55 0.38', 'EQUIPO': '0.31 0.27 0.90' };

            function tableHeader() {
                const h = 22;
                rect(M, y - h, PW - 2 * M, h, DARK);
                const titulos = ['FECHA / HORA', 'TIPO DE EVENTO', 'DESCRIPCIÓN DE LA ACCIÓN'];
                let x = M;
                titulos.forEach(function(tt, i) { text(x + PADX, y - 14.5, tt, 8, true, '1 1 1'); x += COLS[i]; });
                y -= h;
            }

            function newPage(first) {
                if (cur) pages.push(cur);
                cur = '';
                if (first) {
                    y = PH - M;
                    text(M, y - 14, 'BEDELÍA UNIVERSITARIA', 9, true, GRAY);
                    text(M, y - 38, 'Auditoría y Registro General', 20, true, TXT);
                    text(M, y - 54, 'Constancia del historial de movimientos del sistema', 10, false, GRAY);
                    y -= 70;
                    const now = new Date();
                    const p2 = function(n) { return String(n).padStart(2, '0'); };
                    const fechaGen = p2(now.getDate()) + '/' + p2(now.getMonth() + 1) + '/' + now.getFullYear() + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes()) + ':' + p2(now.getSeconds());
                    const u = state.currentUser || {};
                    const quien = (u.name || 'Usuario') + (u.role ? ' (' + u.role + ')' : '');
                    rect(M, y - 58, PW - 2 * M, 58, '0.95 0.96 0.98');
                    text(M + 12, y - 18, 'Fecha y hora de generación:', 9, true, TXT);
                    text(M + 150, y - 18, fechaGen, 9, false, TXT);
                    text(M + 12, y - 34, 'Generado por:', 9, true, TXT);
                    text(M + 150, y - 34, quien, 9, false, TXT);
                    text(M + 12, y - 50, 'Total de registros:', 9, true, TXT);
                    text(M + 150, y - 50, String(logs.length), 9, false, TXT);
                    y -= 78;
                } else {
                    y = PH - M;
                    text(M, y - 10, 'Bedelía Universitaria - Auditoría y Registro General', 8, false, GRAY);
                    hline(y - 16, '0.8 0.82 0.86');
                    y -= 28;
                }
                tableHeader();
            }

            newPage(true);
            logs.forEach(function(log, idx) {
                const c0 = wrap(log.fecha, COLS[0] - 2 * PADX, FS, false);
                const c1 = wrap(log.tipo, COLS[1] - 2 * PADX, FS, true);
                const c2 = wrap(log.descripcion, COLS[2] - 2 * PADX, FS, false);
                const nLines = Math.max(c0.length, c1.length, c2.length);
                const h = nLines * LH + 2 * PADY - 3;
                if (y - h < M + FOOT) newPage(false);
                if (idx % 2 === 1) rect(M, y - h, PW - 2 * M, h, '0.97 0.975 0.985');
                const tipoRgb = TIPO_COLOR[log.tipo] || '0.58 0.20 0.92';
                c0.forEach(function(l, i) { text(M + PADX, y - PADY - FS - i * LH + 2, l, FS, false, GRAY); });
                c1.forEach(function(l, i) { text(M + COLS[0] + PADX, y - PADY - FS - i * LH + 2, l, FS, true, tipoRgb); });
                c2.forEach(function(l, i) { text(M + COLS[0] + COLS[1] + PADX, y - PADY - FS - i * LH + 2, l, FS, false, TXT); });
                y -= h;
                hline(y, '0.88 0.9 0.93');
            });
            pages.push(cur);

            // Pie de página con numeración
            const total = pages.length;
            for (let i = 0; i < total; i++) {
                cur = '';
                hline(M + 14, '0.8 0.82 0.86');
                text(M, M, 'Documento generado por el sistema de Bedelía Universitaria', 8, false, GRAY);
                const lbl = 'Página ' + (i + 1) + ' de ' + total;
                text(PW - M - tw(lbl, 8, false), M, lbl, 8, false, GRAY);
                pages[i] += cur;
            }

            // Armado del archivo PDF
            const objs = [];
            objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
            objs[2] = '<< /Type /Pages /Kids [' + pages.map(function(_, i) { return (6 + 2 * i) + ' 0 R'; }).join(' ') + '] /Count ' + total + ' >>';
            objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
            objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
            const d = new Date(), p2 = function(n) { return String(n).padStart(2, '0'); };
            const pdfDate = 'D:' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
            objs[5] = '<< /Title (' + enc('Auditoría y Registro General - Bedelía Universitaria') + ') /Creator (Bedelia Universitaria) /CreationDate (' + pdfDate + ') >>';
            pages.forEach(function(c, i) {
                objs[6 + 2 * i] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + (7 + 2 * i) + ' 0 R >>';
                objs[7 + 2 * i] = '<< /Length ' + c.length + ' >>\nstream\n' + c + 'endstream';
            });
            let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
            const offsets = [];
            for (let i = 1; i < objs.length; i++) {
                offsets[i] = out.length;
                out += i + ' 0 obj\n' + objs[i] + '\nendobj\n';
            }
            const xrefPos = out.length;
            out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n';
            for (let i = 1; i < objs.length; i++) out += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
            out += 'trailer\n<< /Size ' + objs.length + ' /Root 1 0 R /Info 5 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF';

            const bytes = new Uint8Array(out.length);
            for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Auditoria_Registro_General_' + d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + '.pdf';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
            showToast('PDF descargado correctamente', 'success');
        }

        // Inserta el botón "Descargar PDF" en la vista de Auditoría (también visible para el invitado)
        const renderConInvitado = window.render;

        // ================= BASE DE DATOS EN LA NUBE (Firebase Realtime Database) =================
        // Todos los dispositivos (administrador, usuarios, profesor) leen y escriben en la misma base,
        // y los cambios aparecen en los demás al instante.
        const BEDELIA_DB_URL = 'https://bedelia-universitaria-default-rtdb.firebaseio.com';
        const DB_ROOT = BEDELIA_DB_URL.replace(/\/+$/, '') + '/bedelia';
        const NUBE_COLS = ['equipos', 'profesores', 'prestamos', 'historialLogs'];
        const NUBE_NUEVOS_PRIMERO = { equipos: false, profesores: false, prestamos: true, historialLogs: true };
        const NUBE_ID = { equipos: 'codigo', profesores: 'cc', prestamos: 'id', historialLogs: 'id' };
        const ACC_PEND_KEY = 'bedelia_accesos_pendientes';

        let nubeShadow = {};            // última copia conocida de la nube (para enviar solo lo que cambió)
        let nubeSemilla = null;         // orden inicial al sembrar una base vacía
        let nubeInicializada = false, nubeSincronizando = false, nubeOtraVez = false, nubeRenderPendiente = false;
        let nubeTimer = null, nubePullTimer = null, nubeReintento = null, nubeES = null;
        const saveStateLocal = window.saveState;

        function nubeKey(c, item) {
            const k = String(item[NUBE_ID[c]]).replace(/[.$#\[\]\/\u0000-\u001f\u007f]/g, '_');
            return k || '_';
        }
        function nubeNorm(item) {
            const o = {};
            Object.keys(item).sort().forEach(function(k) {
                if (k === '_t' || item[k] === undefined || item[k] === null) return;
                o[k] = item[k];
            });
            return JSON.stringify(o);
        }
        // Firebase puede devolver una lista como arreglo (ids 1,2,3...) o como objeto: se aceptan ambos
        function nubeLista(v) {
            if (!v) return [];
            const arr = Array.isArray(v) ? v : Object.keys(v).map(function(k) { return v[k]; });
            return arr.filter(function(x) { return x && typeof x === 'object'; });
        }

        function nubeBadge() {
            let b = document.getElementById('nubeBadge');
            if (!b && document.body) {
                b = document.createElement('div');
                b.id = 'nubeBadge';
                b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:40;padding:5px 12px;border-radius:9999px;font-size:11px;background:rgba(15,23,42,.93);border:1px solid #1e293b;color:#cbd5e1;display:flex;align-items:center;gap:6px;pointer-events:none;white-space:nowrap';
                document.body.appendChild(b);
            }
            return b;
        }
        function nubeEstado(e) {
            const b = nubeBadge();
            if (!b) return;
            const m = {
                ok: ['#10b981', 'Sincronizado en la nube'],
                sync: ['#3b82f6', 'Sincronizando…'],
                off: ['#f59e0b', 'Sin conexión: se enviará al reconectar'],
                denied: ['#ef4444', 'Sin permiso en la base de datos']
            }[e];
            b.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:' + m[0] + '"></span><span>' + m[1] + '</span>';
        }

        async function nubeGet() {
            const r = await fetch(DB_ROOT + '.json', { cache: 'no-store' });
            if (r.status === 401 || r.status === 403) { const e = new Error('denied'); e.denied = true; throw e; }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }

        // Compara los datos locales con la última copia de la nube y lista lo que hay que enviar
        function nubeOps() {
            const ops = [];
            NUBE_COLS.forEach(function(c) {
                const lista = state[c] || [], sh = nubeShadow[c] || {}, vistos = {};
                lista.forEach(function(item) {
                    const k = nubeKey(c, item);
                    if (vistos[k]) return;
                    vistos[k] = 1;
                    const n = nubeNorm(item);
                    if (sh[k] !== n) ops.push({ type: sh[k] === undefined ? 'put' : 'patch', coll: c, key: k, item: item, n: n });
                });
                const borrados = Object.keys(sh).filter(function(k) { return !vistos[k]; });
                if (borrados.length) {
                    if (lista.length === 0 && borrados.length >= 5) ops.push({ type: 'delcoll', coll: c });
                    else borrados.forEach(function(k) { ops.push({ type: 'del', coll: c, key: k }); });
                }
            });
            return ops;
        }

        async function nubeEnviar(ops) {
            let fallo = null;
            await Promise.all(ops.map(async function(op) {
                try {
                    const base = DB_ROOT + '/' + op.coll;
                    let r;
                    if (op.type === 'put') {
                        const t = nubeSemilla && nubeSemilla[op.coll] ? nubeSemilla[op.coll][op.key] : undefined;
                        const body = Object.assign({}, op.item, { _t: t !== undefined ? t : { '.sv': 'timestamp' } });
                        r = await fetch(base + '/' + encodeURIComponent(op.key) + '.json', { method: 'PUT', body: JSON.stringify(body) });
                    } else if (op.type === 'patch') {
                        r = await fetch(base + '/' + encodeURIComponent(op.key) + '.json', { method: 'PATCH', body: JSON.stringify(op.item) });
                    } else if (op.type === 'del') {
                        r = await fetch(base + '/' + encodeURIComponent(op.key) + '.json', { method: 'DELETE' });
                    } else {
                        r = await fetch(base + '.json', { method: 'DELETE' });
                    }
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    nubeShadow[op.coll] = nubeShadow[op.coll] || {};
                    if (op.type === 'put' || op.type === 'patch') nubeShadow[op.coll][op.key] = op.n;
                    else if (op.type === 'del') delete nubeShadow[op.coll][op.key];
                    else nubeShadow[op.coll] = {};
                } catch (e) { fallo = e; }
            }));
            if (fallo) throw fallo;
        }

        // Aplica lo que hay en la nube a esta pantalla
        function nubeAplicar(remoto) {
            let cambio = false;
            const nuevo = {};
            NUBE_COLS.forEach(function(c) {
                const filas = nubeLista(remoto[c]).map(function(r) {
                    const item = Object.assign({}, r);
                    const t = typeof item._t === 'number' ? item._t : 0;
                    delete item._t;
                    return { item: item, t: t, key: nubeKey(c, item) };
                });
                filas.sort(function(a, b) {
                    const d = NUBE_NUEVOS_PRIMERO[c] ? b.t - a.t : a.t - b.t;
                    return d || (a.key < b.key ? -1 : 1);
                });
                nuevo[c] = {};
                filas.forEach(function(f) { nuevo[c][f.key] = nubeNorm(f.item); });
                const lista = filas.map(function(f) { return f.item; });
                if (JSON.stringify((state[c] || []).map(nubeNorm)) !== JSON.stringify(lista.map(nubeNorm))) {
                    state[c] = lista;
                    cambio = true;
                }
            });
            nubeShadow = nuevo;
            if (cambio) {
                saveStateLocal();
                nubeRenderPendiente = true;
                nubeRefrescar();
            }
        }

        // No se redibuja la pantalla mientras alguien está escribiendo en un formulario
        function nubeRefrescar() {
            if (!nubeRenderPendiente) return;
            const ae = document.activeElement, app = document.getElementById('app');
            if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && app && app.contains(ae)) return;
            nubeRenderPendiente = false;
            render();
        }

        async function nubeSync() {
            if (nubeSincronizando) { nubeOtraVez = true; return; }
            nubeSincronizando = true;
            try {
                do {
                    nubeOtraVez = false;
                    if (!nubeInicializada) {
                        const remoto = await nubeGet();
                        const vacia = !remoto || NUBE_COLS.every(function(c) { return !remoto[c]; });
                        if (vacia) {
                            // Base vacía: se siembra con los datos de este dispositivo (conservando su orden)
                            nubeSemilla = {};
                            NUBE_COLS.forEach(function(c) {
                                nubeSemilla[c] = {};
                                (state[c] || []).forEach(function(it, i) { nubeSemilla[c][nubeKey(c, it)] = NUBE_NUEVOS_PRIMERO[c] ? 1e12 - i : 1e12 + i; });
                            });
                            nubeShadow = {};
                            nubeEstado('sync');
                            await nubeEnviar(nubeOps());
                            nubeSemilla = null;
                        } else {
                            nubeAplicar(remoto);
                        }
                        nubeInicializada = true;
                    } else {
                        const ops = nubeOps();
                        if (ops.length) { nubeEstado('sync'); await nubeEnviar(ops); }
                        const remoto = await nubeGet();
                        if (nubeOps().length === 0) nubeAplicar(remoto || {});
                        else nubeOtraVez = true;
                    }
                } while (nubeOtraVez);
                await nubeReintentarAccesos();
                nubeEstado('ok');
            } catch (e) {
                nubeEstado(e && e.denied ? 'denied' : 'off');
                clearTimeout(nubeReintento);
                nubeReintento = setTimeout(nubeSync, 8000);
            } finally {
                nubeSincronizando = false;
            }
        }

        // Cada vez que la app guarda, además de guardar en el dispositivo se envía a la nube
        window.saveState = function() {
            saveStateLocal();
            if (!nubeInicializada) return;
            if (nubeOps().length) {
                clearTimeout(nubeTimer);
                nubeTimer = setTimeout(nubeSync, 150);
            }
        };

        // Constancia de accesos en la nube (bedelia/accesos), con fecha y hora del servidor
        async function nubeEnviarAcceso(reg) {
            const r = await fetch(DB_ROOT + '/accesos.json', { method: 'POST', body: JSON.stringify(Object.assign({}, reg, { fecha: { '.sv': 'timestamp' } })) });
            if (!r.ok) throw new Error('HTTP ' + r.status);
        }
        function nubeRegistrarAcceso(reg) {
            nubeEnviarAcceso(reg).catch(function() {
                try {
                    const q = JSON.parse(localStorage.getItem(ACC_PEND_KEY) || '[]');
                    q.push(reg);
                    localStorage.setItem(ACC_PEND_KEY, JSON.stringify(q));
                } catch (e) {}
            });
        }
        async function nubeReintentarAccesos() {
            let q = [];
            try { q = JSON.parse(localStorage.getItem(ACC_PEND_KEY) || '[]'); } catch (e) {}
            if (!q.length) return;
            const resto = [];
            for (const reg of q) {
                try { await nubeEnviarAcceso(reg); } catch (e) { resto.push(reg); }
            }
            try { localStorage.setItem(ACC_PEND_KEY, JSON.stringify(resto)); } catch (e) {}
        }

        // Escucha en tiempo real: cuando otro dispositivo cambia algo, este se actualiza solo
        function nubeIniciarStream() {
            try {
                if (nubeES) nubeES.close();
                nubeES = new EventSource(DB_ROOT + '.json');
                const pull = function() { clearTimeout(nubePullTimer); nubePullTimer = setTimeout(nubeSync, 200); };
                nubeES.addEventListener('put', pull);
                nubeES.addEventListener('patch', pull);
                nubeES.onerror = function() {
                    if (!navigator.onLine) nubeEstado('off');
                    if (nubeES && nubeES.readyState === 2) setTimeout(nubeIniciarStream, 10000);
                };
            } catch (e) {}
        }

        window.addEventListener('load', function() {
            nubeEstado('sync');
            nubeSync();
            nubeIniciarStream();
            setInterval(nubeRefrescar, 1000);
            setInterval(function() { if (!document.hidden) nubeSync(); }, 60000);
        });
        document.addEventListener('visibilitychange', function() { if (!document.hidden) nubeSync(); });
        window.addEventListener('online', function() { nubeSync(); nubeIniciarStream(); });
        window.addEventListener('offline', function() { nubeEstado('off'); });

        // ================= APP INSTALABLE (PWA) =================
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            window.addEventListener('load', function() {
                const teniaControl = !!navigator.serviceWorker.controller;
                let recargado = false;
                navigator.serviceWorker.register('sw.js').catch(function() {});
                // Si hay una versión nueva publicada en GitHub, la app se actualiza sola
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                    if (teniaControl && !recargado) { recargado = true; location.reload(); }
                });
            });
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
