<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedelía U - Control y Gestión de Equipos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <div id="app" class="h-full flex flex-col"></div>

    <script>
        const STORAGE_KEY = 'bedelia_app_final_clean_v9';
        
        let state = loadState();
        let termsAccepted = false;
        let authView = 'login'; // 'login' o 'register'

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { return JSON.parse(saved); } catch(e) { console.error(e); }
            }
            return {
                currentUser: null,
                activeTab: 'dashboard',
                usuariosBD: [
                    { correo: 'bedelia.admin@universidad.edu', password: '123456', nombre: 'Administrador General', rol: 'Administrador' },
                    { correo: 'profesor@universidad.edu', password: '123456', nombre: 'Dr. Carlos Mendoza', rol: 'Usuario' }
                ],
                profesores: [
                    { cc: '1098765432', nombre: 'Dr. Carlos Mendoza', email: 'carlos.mendoza@universidad.edu', depto: 'Ingeniería de Sistemas' }
                ],
                equipos: [
                    { codigo: 'VB-01', tipo: 'Video-beam', modelo: 'Epson PowerLite X49', estado: 'Disponible' },
                    { codigo: 'PC-01', tipo: 'Laptop', modelo: 'Dell Latitude 3420', estado: 'Disponible' },
                    { codigo: 'PC-02', tipo: 'Laptop', modelo: 'HP ProBook 450 G8', estado: 'Prestado' }
                ],
                solicitudesPendientes: [],
                prestamos: [
                    { id: 1, profesor: 'Dr. Carlos Mendoza', equipo: 'PC-02 (Laptop)', fecha: 'Hoy, 08:30 AM', estado: 'Activo' }
                ],
                historialLogs: [
                    { id: 1, fecha: 'Hoy, 08:00 AM', tipo: 'SISTEMA', descripcion: 'Base de datos inicializada con permisos estrictos de usuario.' }
                ],
                toast: null
            };
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function registrarLog(tipo, descripcion) {
            const now = new Date();
            const fecha = `Hoy, ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            state.historialLogs.unshift({ id: Date.now(), fecha, tipo, descripcion });
            saveState();
        }

        function showToast(message, type = 'success') {
            state.toast = { message, type };
            render();
            setTimeout(() => {
                if (state.toast && state.toast.message === message) {
                    state.toast = null;
                    render();
                }
            }, 3000);
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = authView === 'register' ? renderRegisterScreen() : renderLoginScreen();
                return;
            }

            // Seguridad estricta: Si un usuario normal intenta entrar a pestañas prohibidas, lo devolvemos al dashboard
            if (state.currentUser.role !== 'Administrador' && (state.activeTab === 'profesores' || state.activeTab === 'historial')) {
                state.activeTab = 'dashboard';
            }

            app.innerHTML = `
                <div class="h-full flex flex-col md:flex-row bg-slate-950 overflow-hidden">
                    ${renderSidebar()}
                    <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-900 border-l border-slate-800">
                        ${renderHeader()}
                        <main class="flex-1 overflow-y-auto p-4 md:p-8 relative">
                            ${state.toast ? renderToast() : ''}
                            <div class="max-w-7xl mx-auto fade-in">
                                ${
                                    state.activeTab === 'dashboard' ? renderDashboardView() :
                                    state.activeTab === 'prestamos' ? renderPrestamosView() :
                                    state.activeTab === 'equipos' ? renderEquiposView() :
                                    (state.activeTab === 'profesores' && state.currentUser.role === 'Administrador') ? renderProfesoresView() :
                                    (state.activeTab === 'historial' && state.currentUser.role === 'Administrador') ? renderHistorialView() : renderDashboardView()
                                }
                            </div>
                        </main>
                    </div>
                </div>
            `;
        }

        function renderLoginScreen() {
            return `
                <div class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-950">
                    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-8 space-y-6 fade-in">
                        <div class="text-center space-y-2">
                            <div class="inline-flex p-3.5 bg-blue-600/20 border border-blue-500/30 text-blue-400 rounded-2xl mb-1">
                                <i class="fa-solid fa-graduation-cap text-2xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight text-white">Bedelía Universitaria</h1>
                            <p class="text-xs text-slate-400">Inicio de Sesión Académico</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Correo Electrónico</label>
                                <input type="email" id="loginUser" required placeholder="correo@universidad.edu"
                                    class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-blue-500">
                            </div>

                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Contraseña</label>
                                <input type="password" id="loginPass" required placeholder="••••••••"
                                    class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-blue-500">
                            </div>

                            <p id="loginError" class="hidden text-xs text-rose-400 flex items-center space-x-1.5">
                                <i class="fa-solid fa-circle-exclamation"></i>
                                <span>Correo o contraseña incorrectos.</span>
                            </p>

                            <div>
                                <label class="flex items-center space-x-3 cursor-pointer select-none">
                                    <input type="checkbox" id="acceptTerms" ${termsAccepted ? 'checked' : ''} onchange="termsAccepted = this.checked"
                                        class="h-4 w-4 rounded border-slate-700 bg-slate-950 accent-blue-600 cursor-pointer">
                                    <span class="text-xs text-slate-400">Acepto los términos y condiciones del sistema</span>
                                </label>
                            </div>

                            <button type="submit" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all">
                                Iniciar Sesión en el Sistema
                            </button>

                            <div class="text-center pt-2">
                                <button type="button" onclick="authView='register'; render();" class="text-xs text-blue-400 hover:underline">
                                    ¿No tienes cuenta? <strong>Regístrate aquí (Admin o Docente)</strong>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderRegisterScreen() {
            return `
                <div class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-950">
                    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-8 space-y-6 fade-in">
                        <div class="text-center space-y-2">
                            <div class="inline-flex p-3.5 bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 rounded-2xl mb-1">
                                <i class="fa-solid fa-user-plus text-2xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight text-white">Registro de Nueva Cuenta</h1>
                            <p class="text-xs text-slate-400">Crea tu usuario personal para solicitar equipos</p>
                        </div>

                        <form onsubmit="handleRegister(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Nombre Completo (Ej. Juan)</label>
                                <input type="text" id="regNombre" required placeholder="Tu nombre completo"
                                    class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                            </div>

                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Correo Institucional</label>
                                <input type="email" id="regCorreo" required placeholder="correo@universidad.edu"
                                    class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                            </div>

                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Contraseña</label>
                                <input type="password" id="regPass" required placeholder="••••••••"
                                    class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                            </div>

                            <div>
                                <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-1.5">Rol en la Plataforma</label>
                                <select id="regRol" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                                    <option value="Usuario">Docente / Usuario (Solicita equipos a tu nombre)</option>
                                    <option value="Administrador">Administrador (Gestiona y aprueba)</option>
                                </select>
                            </div>

                            <button type="submit" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all">
                                Registrar Cuenta en la BD
                            </button>

                            <div class="text-center pt-2">
                                <button type="button" onclick="authView='login'; render();" class="text-xs text-slate-400 hover:text-white">
                                    ← Volver al inicio de sesión
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleRegister(e) {
            e.preventDefault();
            const nombre = document.getElementById('regNombre').value.trim();
            const correo = document.getElementById('regCorreo').value.trim().toLowerCase();
            const password = document.getElementById('regPass').value;
            const rol = document.getElementById('regRol').value;

            if (state.usuariosBD.some(u => u.correo === correo)) {
                showToast('Ya existe una cuenta con este correo', 'error');
                return;
            }

            state.usuariosBD.push({ correo, password, nombre, rol });
            
            if (rol === 'Usuario') {
                const ccMock = Math.floor(100000000 + Math.random() * 900000000).toString();
                if (!state.profesores.some(p => p.email === correo || p.nombre === nombre)) {
                    state.profesores.push({ cc: ccMock, nombre, email: correo, depto: 'Facultad Académica' });
                }
            }

            registrarLog('REGISTRO', `Nueva cuenta creada (${rol}): ${nombre} (${correo})`);
            saveState();
            showToast('¡Cuenta registrada con éxito! Ya puedes iniciar sesión.');
            authView = 'login';
            render();
        }

        function handleLogin(e) {
            e.preventDefault();
            if (!termsAccepted) {
                alert('Debes aceptar los términos y condiciones.');
                return;
            }
            const correo = document.getElementById('loginUser').value.trim().toLowerCase();
            const pass = document.getElementById('loginPass').value;

            const userFound = state.usuariosBD.find(u => u.correo === correo && u.password === pass);
            if (!userFound) {
                document.getElementById('loginError').classList.remove('hidden');
                return;
            }

            state.currentUser = { name: userFound.nombre, role: userFound.rol, correo: userFound.correo };
            registrarLog('SESIÓN', `Inicio de sesión exitoso: ${userFound.nombre} (${userFound.rol})`);
            saveState();
            showToast(`¡Bienvenido, ${userFound.nombre}!`);
            render();
        }

        function handleLogout() {
            registrarLog('SESIÓN', `Cierre de sesión de ${state.currentUser.name}`);
            state.currentUser = null;
            saveState();
            showToast('Sesión finalizada', 'info');
            render();
        }

        function renderSidebar() {
            const tabs = [
                { id: 'dashboard', label: 'Dashboard General', icon: 'fa-chart-pie' },
                { id: 'prestamos', label: state.currentUser.role === 'Administrador' ? 'Solicitudes & Préstamos' : 'Solicitar Equipos', icon: 'fa-clipboard-list' },
                { id: 'equipos', label: 'Gestión de Equipos', icon: 'fa-desktop' }
            ];

            // EXCLUSIVO PARA ADMINISTRADOR: Directorio de Profesores e Historial de Logs
            if (state.currentUser.role === 'Administrador') {
                tabs.push({ id: 'profesores', label: 'Directorio Profesores', icon: 'fa-chalkboard-user' });
                tabs.push({ id: 'historial', label: 'Historial y Logs (BD)', icon: 'fa-clock-rotate-left' });
            }

            return `
                <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between shrink-0">
                    <div>
                        <div class="p-6 flex items-center space-x-3 border-b border-slate-800/80">
                            <div class="p-2.5 bg-blue-600 text-white rounded-xl shadow-md shadow-blue-600/30">
                                <i class="fa-solid fa-laptop-code"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-sm tracking-wide text-white">BEDELÍA U</h2>
                                <p class="text-[11px] text-slate-400">Rol: ${state.currentUser.role}</p>
                            </div>
                        </div>

                        <nav class="p-4 space-y-1.5">
                            ${tabs.map(t => `
                                <button onclick="switchTab('${t.id}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold transition-all ${state.activeTab === t.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'}">
                                    <i class="fa-solid ${t.icon} w-4 text-center"></i>
                                    <span>${t.label}</span>
                                </button>
                            `).join('')}
                        </nav>
                    </div>

                    <div class="p-4 border-t border-slate-800/80 m-4 bg-slate-900/60 rounded-2xl flex items-center justify-between">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-9 h-9 rounded-full bg-blue-500/20 border border-blue-500/30 text-blue-300 font-semibold flex items-center justify-center shrink-0">
                                ${state.currentUser.name.charAt(0)}
                            </div>
                            <div class="truncate">
                                <p class="text-xs font-semibold text-slate-200 truncate">${state.currentUser.name}</p>
                                <p class="text-[10px] text-slate-400 truncate">${state.currentUser.role}</p>
                            </div>
                        </div>
                        <button onclick="handleLogout()" title="Cerrar Sesión" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-colors">
                            <i class="fa-solid fa-power-off text-xs"></i>
                        </button>
                    </div>
                </aside>
            `;
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            render();
        }

        function renderHeader() {
            return `
                <header class="bg-slate-950/60 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
                    <div>
                        <h1 class="text-base font-bold text-white">Panel de Control (${state.currentUser.role})</h1>
                        <p class="text-xs text-slate-400">Usuario activo: ${state.currentUser.name} (${state.currentUser.correo})</p>
                    </div>
                    <div class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-300 font-medium flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>Sincronizado en la Nube</span>
                    </div>
                </header>
            `;
        }

        function renderToast() {
            if (!state.toast) return '';
            const bg = state.toast.type === 'error' ? 'bg-rose-500/10 border-rose-500/30 text-rose-300' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300';
            return `
                <div class="fixed bottom-6 right-6 z-50 flex items-center space-x-3 px-4 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl ${bg} fade-in">
                    <span class="text-xs font-medium">${state.toast.message}</span>
                </div>
            `;
        }

        function renderDashboardView() {
            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Equipos Totales</span>
                            <p class="text-3xl font-bold text-white mt-4">${state.equipos.length}</p>
                        </div>
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Préstamos Activos</span>
                            <p class="text-3xl font-bold text-white mt-4">${state.prestamos.length}</p>
                        </div>
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Solicitudes Pendientes</span>
                            <p class="text-3xl font-bold text-amber-400 mt-4">${state.solicitudesPendientes.length}</p>
                        </div>
                        <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Cuentas en BD</span>
                            <p class="text-3xl font-bold text-white mt-4">${state.usuariosBD.length}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPrestamosView() {
            const esAdmin = state.currentUser.role === 'Administrador';
            const equiposDisponibles = state.equipos.filter(e => e.estado === 'Disponible');

            return `
                <div class="space-y-6">
                    <!-- Formulario de Solicitud -->
                    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <h3 class="font-bold text-white text-sm">
                            ${esAdmin ? 'Registrar Préstamo Directo' : `Solicitar Equipo a nombre de: <span class="text-blue-400">${state.currentUser.name}</span>`}
                        </h3>
                        <form onsubmit="solicitarEquipo(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${esAdmin ? `
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Seleccionar Docente</label>
                                <select id="solProfesorAdmin" required class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200">
                                    <option value="">Seleccione profesor...</option>
                                    ${state.profesores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('')}
                                </select>
                            </div>` : ''}
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Equipo Disponible</label>
                                <select id="solEquipo" required class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200">
                                    <option value="">Seleccione equipo...</option>
                                    ${equiposDisponibles.map(e => `<option value="${e.codigo} - ${e.modelo} (${e.tipo})">${e.codigo} - ${e.modelo} (${e.tipo})</option>`).join('')}
                                </select>
                            </div>
                            <div class="sm:col-span-2">
                                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-xl shadow-lg shadow-blue-600/30">
                                    ${esAdmin ? 'Aprobar y Registrar de Inmediato' : 'Enviar Solicitud al Administrador'}
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Solicitudes Pendientes (Solo Admin) -->
                    ${esAdmin && state.solicitudesPendientes.length > 0 ? `
                    <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-6 space-y-4">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-bell text-amber-400 animate-bounce"></i>
                            <h3 class="font-bold text-amber-300 text-sm">Solicitudes Pendientes de Docentes (${state.solicitudesPendientes.length})</h3>
                        </div>
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="border-b border-amber-500/20 text-amber-200/70">
                                    <th class="py-3 px-3">Docente</th>
                                    <th class="py-3 px-3">Equipo</th>
                                    <th class="py-3 px-3">Hora</th>
                                    <th class="py-3 px-3 text-right">Acciones de Aprobación</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-amber-500/10">
                                ${state.solicitudesPendientes.map(s => `
                                    <tr>
                                        <td class="py-3 px-3 text-slate-200 font-medium">${s.profesor}</td>
                                        <td class="py-3 px-3 font-mono text-amber-300">${s.equipo}</td>
                                        <td class="py-3 px-3 text-slate-400">${s.fecha}</td>
                                        <td class="py-3 px-3 text-right space-x-2">
                                            <button onclick="aprobarSolicitud(${s.id})" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg shadow-md shadow-emerald-600/30">
                                                <i class="fa-solid fa-check mr-1"></i> Aceptar
                                            </button>
                                            <button onclick="rechazarSolicitudPrompt(${s.id})" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-lg shadow-md shadow-rose-600/30">
                                                <i class="fa-solid fa-xmark mr-1"></i> Rechazar
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>` : ''}

                    <!-- Préstamos Activos -->
                    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                        <h3 class="font-bold text-white text-sm">Préstamos Activos en la Universidad</h3>
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="border-b border-slate-800 text-slate-400">
                                    <th class="py-3 px-3">Docente</th>
                                    <th class="py-3 px-3">Equipo</th>
                                    <th class="py-3 px-3">Hora</th>
                                    <th class="py-3 px-3 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                ${state.prestamos.length === 0 ? '<tr><td colspan="4" class="py-6 text-center text-slate-500">No hay préstamos activos registrados.</td></tr>' : 
                                  state.prestamos.map(p => `
                                    <tr>
                                        <td class="py-3 px-3 text-slate-200">${p.profesor}</td>
                                        <td class="py-3 px-3 font-mono text-blue-400">${p.equipo}</td>
                                        <td class="py-3 px-3 text-slate-400">${p.fecha}</td>
                                        <td class="py-3 px-3 text-right">
                                            <button onclick="devolverPrestamo(${p.id}, '${p.equipo}')" class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 rounded-lg">Devolver</button>
                                        </td>
                                    </tr>
                                  `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderEquiposView() {
            return `
                <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                    <h3 class="font-bold text-white text-sm">Inventario de Equipos (Disponibles y Prestados)</h3>
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400">
                                <th class="py-3 px-3">Código</th>
                                <th class="py-3 px-3">Tipo</th>
                                <th class="py-3 px-3">Modelo</th>
                                <th class="py-3 px-3">Estado</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                            ${state.equipos.map(e => `
                                <tr>
                                    <td class="py-3 px-3 font-mono text-blue-400 font-semibold">${e.codigo}</td>
                                    <td class="py-3 px-3">${e.tipo}</td>
                                    <td class="py-3 px-3 text-slate-200">${e.modelo}</td>
                                    <td class="py-3 px-3">
                                        <span class="px-2.5 py-1 rounded-full text-[10px] font-medium ${e.estado === 'Disponible' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">
                                            ${e.estado}
                                        </span>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderProfesoresView() {
            return `
                <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                    <h3 class="font-bold text-white text-sm">Directorio de Docentes Registrados (Exclusivo Administrador)</h3>
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400">
                                <th class="py-3 px-3">Cédula (CC)</th>
                                <th class="py-3 px-3">Nombre del Docente</th>
                                <th class="py-3 px-3">Correo Institucional</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                            ${state.profesores.map(p => `
                                <tr>
                                    <td class="py-3 px-3 font-mono text-emerald-400">${p.cc}</td>
                                    <td class="py-3 px-3 text-slate-200 font-medium">${p.nombre}</td>
                                    <td class="py-3 px-3 text-slate-400">${p.email || 'N/A'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderHistorialView() {
            return `
                <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                    <h3 class="font-bold text-white text-sm">Auditoría y Constancias (Exclusivo Administrador)</h3>
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400">
                                <th class="py-3 px-3">Fecha y Hora</th>
                                <th class="py-3 px-3">Tipo de Evento</th>
                                <th class="py-3 px-3">Descripción de la Acción</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                            ${state.historialLogs.map(l => `
                                <tr>
                                    <td class="py-3 px-3 font-mono text-slate-400">${l.fecha}</td>
                                    <td class="py-3 px-3"><span class="px-2.5 py-1 bg-blue-500/10 text-blue-400 rounded text-[10px] font-semibold">${l.tipo}</span></td>
                                    <td class="py-3 px-3 text-slate-200">${l.descripcion}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function solicitarEquipo(e) {
            e.preventDefault();
            const equipo = document.getElementById('solEquipo').value;
            const profesor = state.currentUser.role === 'Administrador' 
                ? document.getElementById('solProfesorAdmin').value 
                : state.currentUser.name;

            const now = new Date();
            const fecha = `Hoy, ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

            if (state.currentUser.role === 'Administrador') {
                state.prestamos.unshift({ id: Date.now(), profesor, equipo, fecha, estado: 'Activo' });
                const codigoLimpio = equipo.split(' ')[0];
                const eqObj = state.equipos.find(eq => eq.codigo === codigoLimpio);
                if (eqObj) eqObj.estado = 'Prestado';

                registrarLog('PRÉSTAMO', `Admin aprobó préstamo directo de ${equipo} para ${profesor}`);
                saveState();
                showToast('¡Préstamo registrado correctamente!');
            } else {
                state.solicitudesPendientes.push({ id: Date.now(), profesor, equipo, fecha });
                registrarLog('SOLICITUD', `El docente ${profesor} solicitó el equipo ${equipo}`);
                saveState();
                showToast('¡Solicitud enviada al Administrador con éxito!');
            }
            render();
        }

        function aprobarSolicitud(id) {
            const solicitud = state.solicitudesPendientes.find(s => s.id === id);
            if (solicitud) {
                state.solicitudesPendientes = state.solicitudesPendientes.filter(s => s.id !== id);
                const now = new Date();
                const fecha = `Hoy, ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
                state.prestamos.unshift({ id: solicitud.id, profesor: solicitud.profesor, equipo: solicitud.equipo, fecha, estado: 'Activo' });

                const codigoLimpio = solicitud.equipo.split(' ')[0];
                const eqObj = state.equipos.find(eq => eq.codigo === codigoLimpio);
                if (eqObj) eqObj.estado = 'Prestado';

                registrarLog('APROBACIÓN', `Administrador ACEPTÓ solicitud de ${solicitud.equipo} para ${solicitud.profesor}`);
                saveState();
                showToast('¡Solicitud aceptada y equipo asignado!');
                render();
            }
        }

        function rechazarSolicitudPrompt(id) {
            const motivo = prompt('Ingrese el motivo del rechazo de la solicitud:');
            if (motivo !== null) {
                const motivoTexto = motivo.trim() !== '' ? motivo.trim() : 'Sin motivo especificado';
                const solicitud = state.solicitudesPendientes.find(s => s.id === id);
                if (solicitud) {
                    state.solicitudesPendientes = state.solicitudesPendientes.filter(s => s.id !== id);
                    registrarLog('RECHAZO', `Administrador RECHAZÓ solicitud de ${solicitud.equipo} para ${solicitud.profesor}. Motivo: ${motivoTexto}`);
                    saveState();
                    showToast('Solicitud rechazada correctamente', 'error');
                    render();
                }
            }
        }

        function devolverPrestamo(id, equipoStr) {
            const prestamo = state.prestamos.find(p => p.id === id);
            if (prestamo) {
                state.prestamos = state.prestamos.filter(p => p.id !== id);
                const codigoLimpio = equipoStr.split(' ')[0];
                const eqObj = state.equipos.find(e => e.codigo === codigoLimpio);
                if (eqObj) eqObj.estado = 'Disponible';

                registrarLog('DEVOLUCIÓN', `Se devolvió el equipo ${equipoStr}`);
                saveState();
                showToast('Equipo devuelto correctamente');
                render();
            }
        }

        window.onload = function() { render(); };
    </script>
</body>
</html>
